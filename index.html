<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>ODA Global Fragility Monitor v2.5</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b1016; --card: #161c24; --primary: #3aa3ff;
            --danger: #ff5c5c; --warning: #f2b45a; --success: #61d661; --fg: #e6eef8;
        }
        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid #253245; }
        .control-panel { background: var(--card); padding: 20px; border-radius: 15px; margin: 20px 0; display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
        select, input { padding: 10px; border-radius: 8px; border: 1px solid #364254; background: #0b0f14; color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #253245; }
        .status { font-size: 13px; color: var(--primary); margin-top: 10px; text-align: center; }
        ul { list-style: none; padding: 0; font-size: 14px; }
        li { padding: 10px 0; border-bottom: 1px solid #253245; }
        a { color: var(--primary); text-decoration: none; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; margin-right: 5px; }
        .risk-high { background: var(--danger); color: black; }
        .conf-heat { background: var(--warning); color: black; }
    </style>
</head>
<body>

<header>
    <h2>Global Fragility Monitor (ReliefWeb 실시간 통합)</h2>
    <p style="color:#8aa0bb; font-size:14px;">국제기구 데이터를 분석하여 HDP 넥서스 및 분쟁 위험 지표를 산출합니다.</p>
</header>

<div class="control-panel">
    <select id="countrySelect">
        <option value="South Sudan" data-iso="SSD">South Sudan (남수단)</option>
        <option value="Syria" data-iso="SYR">Syria (시리아)</option>
        <option value="Yemen" data-iso="YEM">Yemen (예멘)</option>
        <option value="Ukraine" data-iso="UKR">Ukraine (우크라이나)</option>
        <option value="Mali" data-iso="MLI">Mali (말리)</option>
        <option value="Somalia" data-iso="SOM">Somalia (소말리아)</option>
        <option value="Palestine" data-iso="PSE">Palestine (팔레스타인)</option>
        </select>
    <label>분석 기간(일): </label><input id="rw-days" type="number" value="180" style="width:70px">
    <button id="fetch-btn">실시간 분석 시작</button>
</div>

<div id="status-msg" class="status">국가를 선택하고 분석 버튼을 눌러주세요.</div>

<div class="grid">
    <div class="card">
        <h3>Conflict Heat & Risk Score</h3>
        <canvas id="riskChart"></canvas>
    </div>
    <div class="card">
        <h3>HDP Nexus Analysis</h3>
        <canvas id="hdpChart"></canvas>
    </div>
    <div class="card" style="grid-column: 1 / -1;">
        <h3>Latest Analyzed Reports</h3>
        <ul id="newsList"></ul>
    </div>
</div>

<script>
/* =============================
   1. 분석 핵심 로직 (recap v2.2 계승)
============================= */
const APPNAME = "HyunKim+recap_km_lite+a5Ttg7U8";
const HDP_DICT = {
    H:['emergency','relief','humanitarian','refugee','famine','outbreak'],
    D:['development','education','clinic','livelihoods','infrastructure'],
    P:['peace','mediation','inclusive','social contract','cohesion']
};
const CONFLICT_TERMS = ['armed clashes','shelling','airstrike','violence','attack','hostilities'];

function analyzeText(text) {
    const T = text.toLowerCase();
    // HDP Score
    const h = HDP_DICT.H.some(w => T.includes(w)) ? 1 : 0;
    const d = HDP_DICT.D.some(w => T.includes(w)) ? 1 : 0;
    const p = HDP_DICT.P.some(w => T.includes(w)) ? 1 : 0;
    
    // Conflict Heat (1-5)
    let cScore = 0;
    CONFLICT_TERMS.forEach(w => { if(T.includes(w)) cScore++; });
    const heat = Math.min(5, Math.max(1, cScore));

    // Risk Score
    let rScore = (T.match(/security|danger|threat|kill|attack/g) || []).length * 2;
    
    return { h, d, p, heat, rScore };
}

/* =============================
   2. 차트 초기화
============================= */
let riskChart, hdpChart;
function initCharts() {
    const ctxR = document.getElementById('riskChart').getContext('2d');
    riskChart = new Chart(ctxR, {
        type: 'line',
        data: { labels: [], datasets: [
            { label: 'Risk Score', data: [], borderColor: '#ff5c5c', fill: false },
            { label: 'Conflict Heat', data: [], borderColor: '#f2b45a', fill: false }
        ]}
    });

    const ctxH = document.getElementById('hdpChart').getContext('2d');
    hdpChart = new Chart(ctxH, {
        type: 'bar',
        data: { labels: ['Humanitarian', 'Development', 'Peace'], datasets: [{
            label: 'Nexus Hits', data: [0, 0, 0], backgroundColor: ['#3aa3ff', '#61d661', '#f2b45a']
        }]}
    });
}

/* =============================
   3. ReliefWeb 데이터 Fetch
============================= */
document.getElementById('fetch-btn').onclick = async function() {
    const select = document.getElementById('countrySelect');
    const iso = select.options[select.selectedIndex].getAttribute('data-iso');
    const countryName = select.value;
    const days = document.getElementById('rw-days').value;
    const status = document.getElementById('status-msg');

    status.textContent = `${countryName} 데이터를 분석 중입니다...`;
    
    const dateLimit = new Date();
    dateLimit.setDate(dateLimit.getDate() - days);
    const dateStr = dateLimit.toISOString().split('T')[0];

    const url = "https://api.reliefweb.int/v1/reports?appname=" + APPNAME;
    const query = {
        "filter": {
            "operator": "AND",
            "conditions": [
                { "field": "country.iso3", "value": iso },
                { "field": "date.created", "value": { "from": dateStr + "T00:00:00+00:00" } }
            ]
        },
        "limit": 10, "preset": "latest", "fields": { "include": ["title", "body", "url", "date"] }
    };

    try {
        const res = await fetch(url, { method: 'POST', body: JSON.stringify(query) });
        const json = await res.json();
        if(!json.data) throw new Error("최신 데이터가 없습니다.");

        let hSum = 0, dSum = 0, pSum = 0;
        let riskData = [], heatData = [], labels = [];
        let html = "";

        json.data.forEach((item, idx) => {
            const f = item.fields;
            const analysis = analyzeText(f.title + " " + (f.body || ""));
            
            hSum += analysis.h; dSum += analysis.d; pSum += analysis.p;
            riskData.push(analysis.rScore);
            heatData.push(analysis.heat);
            labels.push(f.date.created.split('T')[0]);

            html += `<li>
                <span class="badge risk-high">Risk ${analysis.rScore}</span>
                <span class="badge conf-heat">Heat ${analysis.heat}</span>
                <a href="${f.url}" target="_blank">${f.title}</a>
            </li>`;
        });

        // 차트 업데이트
        riskChart.data.labels = labels.reverse();
        riskChart.data.datasets[0].data = riskData.reverse();
        riskChart.data.datasets[1].data = heatData.reverse();
        riskChart.update();

        hdpChart.data.datasets[0].data = [hSum, dSum, pSum];
        hdpChart.update();

        document.getElementById('newsList').innerHTML = html;
        status.textContent = `${countryName} 분석 완료 (문서 ${json.data.length}건 수집)`;

    } catch (e) {
        status.textContent = "에러: " + e.message;
    }
};

window.onload = initCharts;
</script>
</body>
</html>
