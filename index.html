<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>Ewha RECAP - Emergency Data Recovery</title>
    <style>
        :root { --bg: #0b1117; --fg: #e6edf3; --primary: #238636; --line: #30363d; --h-col: #3aa3ff; --d-col: #61d661; --p-col: #f2b45a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
        .dashboard-header { border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .log-box { background: #000; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; height: 100px; overflow-y: auto; margin-bottom: 20px; border: 1px solid var(--line); }
        .status-tag { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #21262d; border: 1px solid var(--line); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #161b22; padding: 15px; border-radius: 10px; border: 1px solid var(--line); text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--primary); margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 10px; overflow: hidden; }
        th { background: #21262d; padding: 12px; text-align: left; font-size: 13px; color: #8b949e; }
        td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
        .hdp-badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 800; margin-right: 4px; color: #000; }
        .hdp-H { background: var(--h-col); } .hdp-D { background: var(--d-col); } .hdp-P { background: var(--p-col); }
        .btn-start { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-start:hover { background: #2ea043; }
    </style>
</head>

<div class="dashboard-header">

    <div class="status-tag" id="mainStatus">시스템 대기 중</div>
    <button class="btn-start" onclick="fetchReliefWebData()">데이터 강제 로드</button>
</div>

<div class="log-box" id="systemLog">

    <div class="stat-card">위험 국가(High)<div id="risk-count" class="stat-val" style="color:#ff5c5c">0</div></div>
</div>

            <th>최신 보고서 분석 요약</th>
        </tr>
    </thead>
    <tbody id="dataTable">
        </tbody>
</table>
