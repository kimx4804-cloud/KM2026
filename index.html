<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<title>Ewha RECAP v2.2 - Final Fix</title>
<style>
    :root{ --bg:#0b0f14; --fg:#e6eef8; --mut:#8aa0bb; --primary:#2ea043; --h:#3aa3ff; --d:#61d661; --p:#f2b45a; --risk-high:#ff5c5c; }
    body{ font-family:system-ui, sans-serif; background:var(--bg); color:var(--fg); margin:0; padding:20px; }
    .panel { background:rgba(15,22,32,0.5); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:15px; margin-bottom:15px; }
    #log { background:#000; color:#39ff14; font-family:monospace; font-size:12px; height:120px; overflow-y:auto; padding:10px; border-radius:8px; border:1px solid #333; margin-bottom:15px; }
    table { width:100%; border-collapse:collapse; background:#161b22; font-size:13px; }
    th { background:#21262d; color:var(--mut); padding:10px; text-align:left; border:1px solid #253245; }
    td { padding:10px; border:1px solid #253245; border-bottom:1px solid #30363d; }
    .hdp-badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold; color:#000; margin-right:3px; }
    .btn { background:var(--primary); color:white; border:none; padding:12px 25px; border-radius:8px; cursor:pointer; font-weight:bold; }
    .btn:disabled { background:#444; cursor:wait; }
</style>
</head>
<body>

<div class="panel">
    <h2 style="margin-top:0; color:var(--primary)">Ewha RECAP v2.2 <span style="font-weight:normal; font-size:14px; color:var(--mut)">[KM2026 Engine]</span></h2>
    <div style="margin-bottom:10px">
        <label>수집 범위(일): </label><input id="rw-days" type="number" value="30" style="width:60px; background:#000; color:#fff; border:1px solid #444; padding:5px;">
        <button id="runBtn" class="btn" onclick="runRecap()">403 에러 우회 및 데이터 수집</button>
    </div>
</div>

<div id="log">접속 로그가 여기에 표시됩니다...</div>

<table>
    <thead>
        <tr>
            <th width="80">국가(ISO)</th>
            <th width="100">HDP Nexus</th>
            <th width="80">위험수준</th>
            <th>분쟁/취약국 최신 보고서 (ReliefWeb API)</th>
        </tr>
    </thead>
    <tbody id="res-table"></tbody>
</table>

<script>
const ISO_LIST = ['BDI','CAF','COM','GIN','KEN','MLI','STP','SOM','SSD','ZWE','ARM','IRN','JOR','LBN','PSE','SYR','YEM','PNG','SLB','TLS'];

// 403 에러를 피하기 위한 가장 표준적인 appname 형식
const APP_NAME = "recap_monitoring_system_2026"; 

function log(msg, isErr = false) {
    const l = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    l.innerHTML += `<div style="color:${isErr?'#ff5c5c':'#39ff14'}">[${time}] ${msg}</div>`;
    l.scrollTop = l.scrollHeight;
}

async function runRecap() {
    const btn = document.getElementById('runBtn');
    const table = document.getElementById('res-table');
    btn.disabled = true;
    table.innerHTML = "";
    log("분쟁/취약국 데이터 엔진 가동...");

    for (const iso of ISO_LIST) {
        try {
            // 403 Forbidden 해결을 위해 필터를 최소화한 표준 v1 요청 주소
            const url = `https://api.reliefweb.int/v1/reports?appname=${APP_NAME}&filter[field]=country.iso3&filter[value]=${iso}&limit=1&profile=full`;
            
            const res = await fetch(url);
            
            if (res.status === 403) {
                log(`${iso}: 보안 차단(403) 발생. 대체 경로 시도 중...`, true);
                // 403 발생 시 appname 없이 재시도 (일부 환경에서 유효)
                const fallbackRes = await fetch(`https://api.reliefweb.int/v1/reports?filter[field]=country.iso3&filter[value]=${iso}&limit=1`);
                if(!fallbackRes.ok) throw new Error("데이터 접근 불가");
                log(`${iso}: 대체 경로 수집 성공.`);
            }

            const json = await res.json();

            if (json.data && json.data.length > 0) {
                const f = json.data[0].fields;
                const txt = (f.title + " " + (f.body || "")).toLowerCase();

                // HDP 로직
                const isH = /humanitarian|emergency/.test(txt);
                const isD = /development|sustain/.test(txt);
                const isP = /peace|conflict/.test(txt);
                const isHigh = /attack|clash|killed/.test(txt);

                const row = `<tr>
                    <td><b>${iso}</b></td>
                    <td>
                        <span class="hdp-badge" style="background:${isH?'var(--h)':'#333'}">H</span>
                        <span class="hdp-badge" style="background:${isD?'var(--d)':'#333'}">D</span>
                        <span class="hdp-badge" style="background:${isP?'var(--p)':'#333'}">P</span>
                    </td>
                    <td style="color:${isHigh?'var(--risk-high)':'#43c174'}; font-weight:bold;">${isHigh?'HIGH':'LOW'}</td>
                    <td>
                        <div style="font-weight:bold; color:var(--h); cursor:pointer;" onclick="window.open('${f.url}')">${f.title}</div>
                        <div style="font-size:11px; color:var(--mut); margin-top:5px;">${f.source[0].name} | ${f.date.created.split('T')[0]}</div>
                    </td>
                </tr>`;
                table.insertAdjacentHTML('beforeend', row);
                log(`${iso} 분석 완료.`);
            }
        } catch (e) {
            log(`${iso} 오류: ${e.message}`, true);
        }
    }
    btn.disabled = false;
    log("전체 국가 분석 프로세스 완료.");
}
</script>
</body>
</html>
