<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <title>Ewha RECAP v2.2 - Emergency Fix</title>
    <style>
        :root { --bg: #0d1117; --fg: #c9d1d9; --primary: #238636; --h: #3aa3ff; --d: #61d661; --p: #f2b45a; --error: #f85149; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--fg); padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 20px; }
        
        /* 실시간 상태 모니터 */
        .status-panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        #log-screen { background: #000; color: #39ff14; font-family: 'Courier New', monospace; font-size: 12px; height: 120px; overflow-y: auto; padding: 10px; border-radius: 4px; border: 1px solid #444; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; text-align: center; }
        .card h4 { margin: 0; color: #8b949e; font-size: 13px; }
        .card .val { font-size: 24px; font-weight: bold; margin-top: 8px; color: var(--primary); }

        table { width: 100%; border-collapse: collapse; border: 1px solid #30363d; }
        th { background: #21262d; padding: 12px; text-align: left; font-size: 12px; color: #8b949e; }
        td { padding: 12px; border-bottom: 1px solid #30363d; font-size: 13px; }

        .hdp-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-right: 3px; color: #000; }
        .bg-h { background: var(--h); } .bg-d { background: var(--d); } .bg-p { background: var(--p); }
        .bg-off { background: #30363d; color: #8b949e; }
        
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #21262d; color: #484f58; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Ewha RECAP v2.2 <span style="font-size:12px; font-weight:normal; color:#8b949e;">(API Recovery Mode)</span></h2>
        <button id="startBtn" onclick="initRecovery()">데이터 수집 강제 실행</button>
    </div>

    <div class="status-panel">
        <div style="margin-bottom:8px; font-size:13px; font-weight:bold;">📡 API 통신 실시간 로그</div>
        <div id="log-screen">준비 완료. 버튼을 클릭하세요.</div>
    </div>

    <div class="grid">
        <div class="card"><h4>수집 국가</h4><div class="val">20</div></div>
        <div class="card"><h4>총 보고서 수</h4><div id="stat-total" class="val">0</div></div>
        <div class="card"><h4>분쟁 고위험군</h4><div id="stat-risk" class="val" style="color:var(--error)">0</div></div>
    </div>

    <table>
        <thead>
            <tr>
                <th width="80">ISO3</th>
                <th width="120">HDP Nexus</th>
                <th width="80">Risk</th>
                <th>최신 보고서 타이틀 (ReliefWeb)</th>
            </tr>
        </thead>
        <tbody id="result-table">
            <tr><td colspan="4" style="text-align:center; padding:30px; color:#8b949e;">데이터가 수집되지 않았습니다.</td></tr>
        </tbody>
    </table>
</div>

<script>
const ISO_LIST = ['BDI','CAF','COM','GIN','KEN','MLI','STP','SOM','SSD','ZWE','ARM','IRN','JOR','LBN','PSE','SYR','YEM','PNG','SLB','TLS'];
const APP_NAME = "HyunKim+recap_km_lite+a5Ttg7U8";

function addLog(msg, isError = false) {
    const screen = document.getElementById('log-screen');
    const time = new Date().toLocaleTimeString();
    screen.innerHTML += `<div style="color:${isError ? '#f85149' : '#39ff14'}">[${time}] ${msg}</div>`;
    screen.scrollTop = screen.scrollHeight;
}

async function initRecovery() {
    const btn = document.getElementById('startBtn');
    const table = document.getElementById('result-table');
    btn.disabled = true;
    table.innerHTML = "";
    addLog("ReliefWeb API 서버 접속 시도 중...");

    let riskCount = 0;
    let totalDocs = 0;

    for (const iso of ISO_LIST) {
        try {
            // 구버전 및 신버전 호환을 위해 쿼리 파라미터 최적화
            const url = `https://api.reliefweb.int/v1/reports?appname=${APP_NAME}&filter[field]=country.iso3&filter[value]=${iso}&limit=1&profile=full`;
            
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const json = await response.json();

            if (json.data && json.data.length > 0) {
                const doc = json.data[0].fields;
                const title = doc.title;
                const text = (title + (doc.body || "")).toLowerCase();

                // HDP 분석
                const h = /humanitarian|emergency|relief/.test(text);
                const d = /development|infrastructure|livelihood/.test(text);
                const p = /peace|conflict|security/.test(text);

                // Risk 분석
                const isHigh = /attack|clash|killed|violence|dead/.test(text);
                if(isHigh) riskCount++;
                totalDocs += json.totalCount;

                const row = `<tr>
                    <td><b>${iso}</b></td>
                    <td>
                        <span class="hdp-badge ${h?'bg-h':'bg-off'}">H</span>
                        <span class="hdp-badge ${d?'bg-d':'bg-off'}">D</span>
                        <span class="hdp-badge ${p?'bg-p':'bg-off'}">P</span>
                    </td>
                    <td><b style="color:${isHigh?'var(--error)':'#43c174'}">${isHigh?'HIGH':'LOW'}</b></td>
                    <td>
                        <div style="font-weight:bold; color:var(--h);">${title}</div>
                        <div style="font-size:11px; color:#8b949e; margin-top:4px;">${doc.source[0].name} | ${doc.date.created.split('T')[0]}</div>
                    </td>
                </tr>`;
                table.insertAdjacentHTML('beforeend', row);
                
                document.getElementById('stat-total').innerText = totalDocs.toLocaleString();
                document.getElementById('stat-risk').innerText = riskCount;
                addLog(`${iso} 데이터 수집 완료.`);
            } else {
                addLog(`${iso} 최근 데이터 없음.`, true);
            }
        } catch (e) {
            addLog(`${iso} 오류: ${e.message}`, true);
        }
    }
    btn.disabled = false;
    btn.innerText = "업데이트 완료";
}
</script>
</body>
</html>
